# TEAMSCI1110: no workflow ran on any PR because the repository had none (measured 2026-11-10: no
# .github on master, main or feat/setup-ux-adaptation, Actions enabled, 0 runs ever).
# pull_request only (never pull_request_target: fork PRs run here), read-only token, no secrets,
# every action pinned to a full commit SHA.
name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - feat/setup-ux-adaptation

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Install (lockfile only)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
